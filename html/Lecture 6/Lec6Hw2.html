<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Novell Service Login</h1>

    <div>
        <form action="welcomePage.html" target="_blank">
            
            <label for="userName">Userame: </label>
            <input type="text" id="userName" required>

            <br><br>
            <label for="password">Password: </label>
            <input type="password" id="password" required>

            
            <br><br>
            <label for="city">City of Employment: </label>
            <input type="text" id="city" required>

            <br><br>
            <label for="server">Web Server:</label>
            <select name="" id="server" placeholder="---Choose a server---" required>
                <option value="bsnl">BSNL</option>
                <option value="jio">Jio</option>
                <option value="airtel" selected>Airtel</option>
            </select>

            
            <br><br>
            <label for="role"> Please Specify your role: </label>
            <br>
            <label for="admin"> Admin: </label>
            
            <input type="radio" id="admin" name="role" required>
            <br>
            <label for="eng"> Engineer: </label>
            <input type="radio" id="eng" name="role" required>
            <br>
            <label for="man"> Manager: </label>
            <input type="radio" id="man" name="role" required>
            <br>
            <label for="guest"> Guest: </label>
            <input type="radio" id="guest" name="role" required>

            <br><br>
            <label for="sign"> Single Sign-on to the following: </label>
            <br>
            <label for="mail"> Mail: </label>
            <input type="radio" id="mail" name="sign" required>
            <br>
            <label for="payroll"> Payroll: </label>
            <input type="radio" id="payroll" name="sign" required>
            <br>
            <label for="ss"> Self-Service: </label>
            <input type="radio" id="ss" name="sign" required>
            

            

            <br><br>
            <button type="submit"> Login </button>
            <button type="submit"> Reset </button>

        </form>
    </div>
</body>
</html>
