<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>

    <div>
        <form action="welcomePage.html" target="_blank">
            <fieldset>
                <legend>Enter Your Basic Information</legend>
            <label for="fullName">Full Name: </label>
            <input type="text" id="fullName" placeholder="Enter Your Name" required>

            <br><br>
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Enter Your Email" required>

            <br><br>
            <label for="password">Password: </label>
            <input type="password" id="password" placeholder="Enter Your Password" required>

            <br><br>
            <label for="checkbox">Are you 18+: </label>
            <input type="checkbox" id="checkbox" required>

            <br><br>
            <label for="phoneNumber"> Enter your phone number: </label>
            <input type="number" id="phoneNumber" required minlength="10" min="0" maxlength="10">

            <br><br>
            <label for="gender"> Gender: </label>
            <label for="male"> Male: </label>
            <input type="radio" id="male" name="gender" required>
            <label for="female"> Female: </label>
            <input type="radio" id="female" name="gender" required>

            <br><br>
            <label for="date"> Enter your DOB: </label>
            <input type="date" id="date" required>

            <br><br>
            <label for="file"> Upload Photo: </label>
            <input type="file" id="file" required>
            
            <br><br>
            <label for="city">Select Your City:</label>
            <select name="" id="city" required>
                <option value="bhubaneswar">Bhubaneswar</option>
                <option value="delhi">Delhi</option>
                <option value="pune" selected>Pune</option>
                <option value="bombay">Bombay</option>
                <option value="kolkta">Kolkata</option>
            </select>

            <br><br>
            <button type="submit"> Submit Form </button>
</fieldset>
        </form>
    </div>
</body>
</html>
